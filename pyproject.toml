[project]
name = "text-independent-writer-verification"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[tool.uv.sources]
# Diciamo a uv dove andare a prendere torch se viene richiesto l'indice CUDA,
# ma lasciamo che il pacchetto base si adatti.
torch = [
    { marker = "sys_platform == 'win32'", index = "pytorch-cuda" },
    { marker = "sys_platform == 'linux'", index = "pytorch-cuda" },
]
torchvision = [
    { marker = "sys_platform == 'win32'", index = "pytorch-cuda" },
    { marker = "sys_platform == 'linux'", index = "pytorch-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true